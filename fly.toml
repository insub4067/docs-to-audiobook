# fly.toml app configuration file generated for docs-to-audiobook on 2026-07-30T13:46:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'docs-to-audiobook'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 7860
  force_https = true
  # 예전에는 'off'였다. 콜드 스타트마다 ONNX 모델을 올리고 기본 오디오북을
  # 다시 합성한다는 이유였는데, 둘 다 지금은 해당 없다 — ONNX는 supertonic을
  # 걷어내며 사라졌고, 기본 오디오북은 부팅 때 합성하지 않고 Supabase
  # Storage에서 내려받기만 한다(main.py의 prepare_default_book_from_cache).
  #
  # 'stop'이 아니라 'suspend'인 이유: text_storage와 jobs가 프로세스
  # 인메모리라, 그냥 멈추면 "업로드는 했는데 아직 변환을 안 누른" 문서를
  # 잃는다. suspend는 메모리를 스냅샷으로 저장했다가 그대로 되살린다.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # 반드시 1대만 떠야 한다. text_storage와 jobs가 프로세스 인메모리라
  # 머신이 2대면 업로드와 합성이 서로 다른 머신에 붙어 404가 난다.
  # (실측: POST /api/synthesize가 text_id를 못 찾아 404, 폴링도 404)
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[vm.swap]
  swap_size_mb = 1024
