name: CI/CD Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # push 이벤트로 실행이 생성되지 않는 일이 있었다(설정은 정상인데 4번
  # 연속 무시됨). 그럴 때 손으로라도 테스트를 돌릴 수 있게 열어둔다.
  # 배포는 이 워크플로가 아니라 Fly의 GitHub 연동이 별도로 하므로,
  # 수동 실행에서는 테스트만 돈다(deploy 잡의 event_name 조건 참고).
  workflow_dispatch:

jobs:
  # 🧪 병렬 작업 1: 테스트 (배포와 무관하게 돌아감)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      # "/"와 "/share/:id"가 이 빌드 결과물(app.html)을 서빙하므로, 관련
      # 테스트(test_front_end_routes 등)가 실제 파일을 찾도록 먼저 빌드한다.
      - run: |
          cd frontend
          npm ci
          npm run build
          npm run build:app
      # Vue 컴포넌트 회귀 테스트(Vitest). 실제로 프로덕션에서 터졌던
      # 패턴(멀티루트 v-show 무시, lucide 아이콘 교체와 v-if 충돌)을 잡는다.
      - run: npm test
        working-directory: frontend
      - run: pytest -v
      # 린터는 테스트 뒤에 둔다. 실패했을 때 "테스트가 깨진 것"과 "스타일만
      # 걸린 것"을 로그 순서만 보고도 구분할 수 있다. 규칙은 일부러 좁게
      # 잡혀 있다 — ruff.toml, frontend/eslint.config.js의 주석 참고.
      - run: ruff check backend/
      - run: npm run lint
        working-directory: frontend

  # 🚀 Fly.io 배포 — 반드시 test가 통과한 뒤에만 돈다.
  #
  # 예전에는 test와 병렬로 돌았다(배포를 몇 분이라도 빨리 하려고). 그 대가로
  # 테스트·빌드·린트가 깨진 커밋도 그대로 프로덕션에 나갔다. 사용자가 있는
  # 서비스에서 "빠른 배포"가 "깨진 배포"보다 나을 이유가 없다.
  #
  # ⚠️ 이 저장소는 Fly의 GitHub 연동으로도 배포될 수 있다. 그쪽이 켜져 있으면
  # 이 게이트를 우회해 main push마다 바로 배포하므로, Fly 대시보드에서
  # 자동 배포를 끄고 이 워크플로만 배포 경로로 남겨야 실제로 막힌다.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}