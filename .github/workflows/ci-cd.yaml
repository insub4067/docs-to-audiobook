name: CI/CD Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # push 이벤트로 실행이 생성되지 않는 일이 있었다(설정은 정상인데 4번
  # 연속 무시됨). 그럴 때 손으로라도 테스트를 돌릴 수 있게 열어둔다.
  # 배포는 이 워크플로가 아니라 Fly의 GitHub 연동이 별도로 하므로,
  # 수동 실행에서는 테스트만 돈다(deploy 잡의 event_name 조건 참고).
  workflow_dispatch:

jobs:
  # 🧪 병렬 작업 1: 테스트 (배포와 무관하게 돌아감)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      # "/"와 "/share/:id"가 이 빌드 결과물(app.html)을 서빙하므로, 관련
      # 테스트(test_front_end_routes 등)가 실제 파일을 찾도록 먼저 빌드한다.
      - run: |
          cd frontend
          npm ci
          npm run build
          npm run build:app
      # Vue 컴포넌트 회귀 테스트(Vitest). 실제로 프로덕션에서 터졌던
      # 패턴(멀티루트 v-show 무시, lucide 아이콘 교체와 v-if 충돌)을 잡는다.
      - run: npm test
        working-directory: frontend
      - run: pytest -v

  # 🚀 병렬 작업 2: Fly.io 배포 (테스트 성공 여부를 기다리지 않고 즉시 배포)
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}