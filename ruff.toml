# Python 린터 설정.
#
# 규칙을 일부러 좁게 잡았다. 목표는 "코드 스타일 통일"이 아니라 "버그를 잡는
# 것"이다. 스타일 규칙까지 켜면 첫날에 200건이 넘게 나오고, 그걸 한 번에
# 고치느라 손대지 않아도 될 파일 수십 개가 diff에 들어온다. 그러면 정작
# 중요한 변경이 그 안에 묻힌다.
#
# 넓히고 싶어지면 한 번에 한 규칙씩, 위반을 실제로 다 고칠 수 있을 때만 켠다.
#
# 지금 일부러 끄고 있는 것과 이유:
#   BLE001(60건) 광범위한 except — 이 프로젝트의 "조용한 실패" 문제와 정확히
#     같은 주제라 켜고 싶지만, 60개 except의 동작을 바꾸는 건 린터 도입과
#     별개의 작업이다. client_errors 텔레메트리로 먼저 실태를 본 뒤 판단한다.
#   I001(67건) import 정렬 — 순수 스타일. 버그를 잡지 않는다.
#   ASYNC230(16건) async 함수 안의 blocking open — 실제 위험이지만
#     TTS 합성 경로 전반을 다시 봐야 해서 별도 작업이다.
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# ⚠️ load_dotenv()가 다른 import보다 먼저 실행돼야 한다. 환경변수를 모듈
# 로드 시점에 읽는 모듈들이 있어서, import를 위로 올리면 값이 빈 채로 잡힌다.
"backend/main.py" = ["E402"]
# 테스트 중간에서 모듈을 다시 import해 초기화 시점 동작을 확인한다.
"backend/tests/test_text_processing.py" = ["E402"]
