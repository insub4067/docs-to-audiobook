<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>TextAudio 관리자 지표</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    <main class="metric-page-shell">
        <a class="metric-page-back" href="/admin">← 이용 현황</a>
        <p id="metricPageStatus" class="metric-page-status" role="status" aria-live="polite">지표를 불러오는 중입니다.</p>
        <section id="metricPageContent" hidden>
            <header class="metric-page-header">
                <p class="section-kicker">METRIC DETAIL</p>
                <h1 id="metricPageTitle"></h1>
                <strong id="metricPageValue" class="metric-page-value"></strong>
                <p id="metricPageDescription" class="metric-page-description"></p>
                <p id="metricPageBasis" class="metric-page-basis"></p>
            </header>
            <p class="metric-page-list-title">포함된 사용자</p>
            <ul id="metricPageList" class="metric-page-list"></ul>
        </section>
    </main>
    <script src="/static/admin-metric.js"></script>
</body>
</html>
