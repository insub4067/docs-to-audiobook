<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <!-- status-bar-style을 black-translucent로 두면 iOS가 웹뷰를 화면
         맨 위(y=0)에 붙이면서도 높이는 상태바를 뺀 793pt(852-59)로 잡는다.
         그 결과 화면 아래 59pt가 웹뷰 바깥이 되어, bottom:0으로 붙인
         시트 아래에 웹뷰가 그릴 수 없는 띠가 남는다(실기기 계측:
         innerHeight=793, screen=852, 카드 실제 렌더 끝 793).
         translucent를 빼면 웹뷰가 상태바 아래(y=59)에서 시작해 높이 793으로
         화면 바닥과 정확히 맞아떨어진다. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TextAudio 관리자">
    <meta name="theme-color" content="#5d4b40">
    <title>TextAudio 관리자</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/main-admin.ts"></script>
</body>
</html>
